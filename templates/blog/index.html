{% extends "base.html" %}

{% block content %}
  {% for post in page_obj %}
    <h2>
      <a href="{% url 'blog:post-detail' post.id%}">{{ post.title }}</a>
    </h2>
    <p>{{ post.author }} {{ post.created_time }}</p>
    <p>{{ post.content }}</p>
    <p>{{ post.commentaries.count }}</p>
  {% empty %}
    <p>No posts yet</p>
  {% endfor %}
{% endblock %}
